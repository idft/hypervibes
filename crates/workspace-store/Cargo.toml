[package]
name = "workspace-store"
version.workspace = true
edition = "2024"
rust-version = "1.96"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs"] }
sha2 = "0.10"
uuid = { version = "1", features = ["serde"] }
