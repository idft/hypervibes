<nav class="mt-2 overflow-x-auto" aria-label="Agent sections">
    <div data-agent-tabs class="relative flex min-w-[48rem] gap-1 rounded-2xl border border-zinc-800 bg-[#0d0d10] p-1 sm:min-w-full">
        <div data-agent-tab-indicator aria-hidden="true" class="pointer-events-none absolute bottom-1 left-0 top-1 z-0 rounded-xl bg-zinc-800 opacity-0" style="transition: transform 200ms ease-out, width 200ms ease-out, opacity 200ms ease-out;"></div>
        {% for tab in tabs %}
        {% if agent_tabs_use_htmx %}
        {% if tab.active %}
        <a href="{{ tab.href }}" data-agent-tab-link hx-get="{{ tab.href }}" hx-select="#agent-show-tab-content" hx-target="#agent-show-tab-content" hx-swap="outerHTML" hx-push-url="true" aria-current="page" class="relative z-10 inline-flex w-full items-center justify-center whitespace-nowrap rounded-xl px-4 py-2 text-sm font-medium text-white" style="flex: 1 1 0;">
            {{ tab.label }}
        </a>
        {% else %}
        <a href="{{ tab.href }}" data-agent-tab-link hx-get="{{ tab.href }}" hx-select="#agent-show-tab-content" hx-target="#agent-show-tab-content" hx-swap="outerHTML" hx-push-url="true" class="relative z-10 inline-flex w-full items-center justify-center whitespace-nowrap rounded-xl px-4 py-2 text-sm font-medium text-zinc-400 hover:text-white" style="flex: 1 1 0;">
            {{ tab.label }}
        </a>
        {% endif %}
        {% else %}
        {% if tab.active %}
        <a href="{{ tab.href }}" data-agent-tab-link aria-current="page" class="relative z-10 inline-flex w-full items-center justify-center whitespace-nowrap rounded-xl px-4 py-2 text-sm font-medium text-white" style="flex: 1 1 0;">
            {{ tab.label }}
        </a>
        {% else %}
        <a href="{{ tab.href }}" data-agent-tab-link class="relative z-10 inline-flex w-full items-center justify-center whitespace-nowrap rounded-xl px-4 py-2 text-sm font-medium text-zinc-400 hover:text-white" style="flex: 1 1 0;">
            {{ tab.label }}
        </a>
        {% endif %}
        {% endif %}
        {% endfor %}
    </div>
</nav>
