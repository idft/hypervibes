{% extends "base.html" %}
{% block title %}Settings - Vibetrading{% endblock %}
{% block content %}
<section class="p-6 lg:p-10">
    <div class="mx-auto max-w-4xl">
        <h1 class="text-2xl font-semibold text-white">Settings</h1>
        <p class="mt-2 text-sm text-zinc-400">Global configuration for the Vibetrading system.</p>

        <section class="mt-8 rounded-2xl border border-zinc-800 bg-[#0d0d10] p-6">
            <form action="/settings" method="post" class="space-y-5">
                <div>
                    <label for="system_prompt" class="text-xs uppercase tracking-[0.16em] text-zinc-500">OpenCode System Prompt</label>
                    <p class="mt-1 text-xs text-zinc-500">This prompt is prepended to every OpenCode agent job prompt.</p>
                    <textarea id="system_prompt" name="system_prompt" rows="12" placeholder="Enter the global system prompt..." class="mt-2 w-full rounded-xl border border-zinc-800 bg-zinc-950/70 px-4 py-3 text-sm leading-6 text-zinc-200 outline-none placeholder:text-zinc-600 focus:border-zinc-700">{{ system_prompt }}</textarea>
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="rounded-full bg-white px-4 py-2 text-sm font-medium text-black hover:bg-zinc-200">Save</button>
                </div>
            </form>
        </section>
    </div>
</section>
{% endblock %}
