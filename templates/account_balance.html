<div id="account-balance-content" class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
    <div>
        <div class="text-xs uppercase tracking-[0.16em] text-zinc-500">Total balance</div>
        <div class="mt-1 flex items-baseline gap-2">
            {% if let Some(formatted) = view.formatted_total() %}
            <span class="font-mono text-2xl font-semibold tabular-nums text-emerald-400">{{ formatted }}</span>
            <span class="text-xs text-zinc-500">USDC</span>
            {% else %}
            <span class="text-base italic text-zinc-500">Loading…</span>
            {% endif %}
        </div>
    </div>
</div>
