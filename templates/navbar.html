<div class="relative flex h-full items-center">
    <details class="relative h-full" data-agent-selector>
        <summary hx-get="/agents/navigation" hx-trigger="click once" hx-target="#agent-selector-items" hx-swap="innerHTML" class="flex h-full cursor-pointer list-none items-center gap-2 px-4 text-sm text-zinc-300 hover:bg-zinc-800 hover:text-white [&::-webkit-details-marker]:hidden">
            <span data-agent-selector-status class="hidden h-2 w-2 rounded-full bg-zinc-600"></span>
            <span data-agent-selector-label>Agents</span>
            <svg class="h-4 w-4 text-zinc-500" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.17l3.71-3.94a.75.75 0 1 1 1.09 1.04l-4.25 4.5a.75.75 0 0 1-1.09 0l-4.25-4.5a.75.75 0 0 1 .02-1.06Z" clip-rule="evenodd"></path></svg>
        </summary>
        <div class="absolute left-0 top-full mt-2 w-64 rounded-lg border border-zinc-700 bg-[#1b1d20] p-1 shadow-2xl">
            <div id="agent-selector-items">
                <div class="px-3 py-2 text-sm text-zinc-500">Open to load agents…</div>
            </div>
        </div>
    </details>
    <a href="/agents" class="absolute left-1/2 flex h-full -translate-x-1/2 items-center gap-2 px-4 text-sm font-semibold tracking-wide text-zinc-100 hover:bg-zinc-800" aria-label="Vibetrading agents">
        <img src="/static/apple-touch-icon.png" alt="" class="h-7 w-7 rounded-md object-cover">
        <span>Vibetrading</span>
    </a>
    {% if navbar.has_warnings() %}
    <a href="/account" title="{{ navbar.tooltip() }}" data-navbar-warning class="ml-auto inline-flex h-9 items-center gap-1.5 rounded-lg px-2 text-amber-400 hover:bg-zinc-800 hover:text-amber-300" aria-label="Configuration warnings: {{ navbar.aria_label() }}">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/></svg>
        <span class="text-sm font-semibold">{{ navbar.warnings.len() }}</span>
    </a>
    {% else %}
    <span data-navbar-warning-placeholder class="ml-auto"></span>
    {% endif %}
    <a href="https://github.com/johnkozan/vibetrading" target="_blank" rel="noopener noreferrer" title="Vibetrading on GitHub" aria-label="Vibetrading on GitHub" class="{% if navbar.has_warnings() %}ml-0{% else %}ml-auto{% endif %} inline-flex h-9 w-9 items-center justify-center rounded-lg text-zinc-400 hover:bg-zinc-800 hover:text-white">
        <span class="github-icon h-5 w-5" aria-hidden="true"></span>
    </a>
    <a href="/settings" title="Settings" class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-zinc-400 hover:bg-zinc-800 hover:text-white">
        <svg class="h-5 w-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8.7 2.4a1.5 1.5 0 0 1 2.6 0l.35.69a1.5 1.5 0 0 0 1.4.82l.77-.1a1.5 1.5 0 0 1 1.84 1.84l-.1.77a1.5 1.5 0 0 0 .82 1.4l.69.35a1.5 1.5 0 0 1 0 2.6l-.69.35a1.5 1.5 0 0 0-.82 1.4l.1.77a1.5 1.5 0 0 1-1.84 1.84l-.77-.1a1.5 1.5 0 0 0-1.4.82l-.35.69a1.5 1.5 0 0 1-2.6 0l-.35-.69a1.5 1.5 0 0 0-1.4-.82l-.77.1a1.5 1.5 0 0 1-1.84-1.84l.1-.77a1.5 1.5 0 0 0-.82-1.4l-.69-.35a1.5 1.5 0 0 1 0-2.6l.69-.35a1.5 1.5 0 0 0 .82-1.4l-.1-.77A1.5 1.5 0 0 1 6.6 3.8l.77.1a1.5 1.5 0 0 0 1.4-.82l.35-.69Z"></path><circle cx="10" cy="10" r="2.5"></circle></svg>
    </a>
    <a href="/account" data-account-navbar title="Account" class="flex items-center gap-1.5 rounded-lg px-2 py-1 text-xs text-zinc-400 hover:bg-zinc-800 hover:text-white"><img data-account-identicon alt="" class="hidden h-5 w-5 rounded-full"><span data-account-navbar-label class="font-mono">Account</span></a>
</div>
