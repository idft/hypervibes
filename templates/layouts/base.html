<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}HyperVibes{% endblock %}</title>
    <link rel="icon" href="/static/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <script>try { if (localStorage.getItem("agent-rail-expanded") === "false") document.documentElement.classList.add("agent-rail-initially-collapsed"); } catch (_) {}</script>
    <link rel="stylesheet" href="/static/dist/app.css">
    <script src="/static/dist/app.js" type="module"></script>
</head>
<body class="bg-[#0a0a0b] text-zinc-100 antialiased">
    <header class="fixed inset-x-0 top-0 z-40 h-14 border-b border-zinc-800 bg-[#17191c]">
        {% include "layouts/navbar.html" %}
    </header>
    <div class="app-shell fixed inset-x-0 bottom-0 top-14 overflow-y-auto">
        <main class="app-content min-w-0 {% if current_path.starts_with("/agents/") && current_path != "/agents/new" %}h-full p-2 has-agent-rail agent-rail-expanded{% else %}px-4 py-6 sm:px-6 lg:px-8{% endif %}">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script>
        document.querySelectorAll("time.local-datetime").forEach((node) => {
            const value = node.dateTime;
            const date = new Date(value);
            if (!value || Number.isNaN(date.getTime())) return;
            const format = node.dataset.localFormat ?? "datetime";
            const options = format === "date"
                ? { year: "numeric", month: "short", day: "numeric" }
                : format === "time"
                    ? { hour: "numeric", minute: "2-digit" }
                    : { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" };
            node.textContent = new Intl.DateTimeFormat(undefined, options).format(date);
            node.classList.add("local-datetime-ready");
        });
    </script>

</body>
</html>
