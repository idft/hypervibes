<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Vibetrading{% endblock %}</title>
    <link rel="icon" href="/static/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <link rel="stylesheet" href="/static/dist/app.css">
    <script src="/static/dist/app.js" type="module"></script>
</head>
<body class="bg-[#0a0a0b] text-zinc-100 antialiased">
    <header class="fixed inset-x-0 top-0 z-40 h-14 border-b border-zinc-800 bg-[#17191c]">
        {% include "layouts/navbar.html" %}
    </header>
    <div class="app-shell fixed inset-x-0 bottom-0 top-14 overflow-y-scroll">
        <main class="app-content min-w-0 {% if current_path.starts_with("/agents/") && current_path != "/agents/new" %}p-2 has-agent-rail{% else %}px-4 py-6 sm:px-6 lg:px-8{% endif %}">
            {% block content %}{% endblock %}
        </main>
    </div>

</body>
</html>
