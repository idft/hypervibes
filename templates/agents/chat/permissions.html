{% if !requests.is_empty() %}<section class="border-t border-amber-900/60 bg-amber-950/20 p-3"><h3 class="text-sm font-medium text-amber-100">Approval required</h3>{% for request in requests %}<div class="mt-2 flex flex-wrap items-center gap-2 text-sm text-zinc-200"><span class="font-mono">{{ request.permission }}</span><span class="text-zinc-500">{{ request.patterns }}</span><form action="/agents/{{ agent_key }}/chat/{{ conversation_id }}/permissions/{{ request.id }}/reply" method="post"><input type="hidden" name="reply" value="once"><button class="cursor-pointer border border-emerald-800 px-2 py-1 text-xs text-emerald-200">Allow once</button></form><form action="/agents/{{ agent_key }}/chat/{{ conversation_id }}/permissions/{{ request.id }}/reply" method="post"><input type="hidden" name="reply" value="reject"><button class="cursor-pointer border border-red-900 px-2 py-1 text-xs text-red-200">Reject</button></form></div>{% endfor %}</section>{% endif %}
