<form action="/agents/{{ agent_key }}/chat/{{ conversation_id }}/messages" method="post" hx-post="/agents/{{ agent_key }}/chat/{{ conversation_id }}/messages" hx-target="#conversation-composer" hx-swap="innerHTML" class="border-t border-zinc-800 bg-zinc-950/30 px-4 py-4 sm:px-6"><input type="hidden" name="message_id" value="{{ message_id }}">{% if let Some(error) = error %}<p class="mb-3 rounded-xl border border-red-900/60 bg-red-950/30 px-3 py-2 text-sm text-red-200">{{ error }}</p>{% endif %}<div class="flex items-end gap-3"><textarea name="message" rows="2" autofocus {% if busy %}disabled{% endif %} class="min-w-0 flex-1 resize-none rounded-2xl border border-zinc-800 bg-zinc-950 px-4 py-3 text-sm text-zinc-100 placeholder-zinc-600 focus:border-zinc-600 focus:outline-none" placeholder="Message this agent">{{ message }}</textarea><button type="submit" {% if busy %}disabled{% endif %} class="inline-flex items-center gap-2 rounded-full border px-4 py-2 text-sm font-medium {% if busy %}cursor-not-allowed border-zinc-800 bg-zinc-900 text-zinc-500{% else %}cursor-pointer border-sky-900/60 bg-sky-950/30 text-sky-300 hover:border-sky-800 hover:bg-sky-950/50 hover:text-sky-200{% endif %}"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"></path></svg>Send</button></div><p class="mt-2 text-xs text-zinc-500">Enter to send · Shift+Enter for a new line</p></form>
