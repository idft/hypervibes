{% if items.is_empty() %}
<p class="text-sm text-zinc-500">No activity yet.</p>
{% else %}
<ul class="space-y-2">
    {% for item in items %}
    <li class="flex min-w-0 items-center gap-2">
        <div class="flex shrink-0 items-center gap-2 whitespace-nowrap text-xs">
            <time class="timeago {% if item.is_expired %}text-amber-400{% else %}text-zinc-500{% endif %}" title="{{ item.created_at_fallback_text }}{% if item.is_expired %} (expired at {{ item.expires_at_iso }}){% endif %}" datetime="{{ item.created_at_iso }}">{{ item.created_at_fallback_text }}</time>
            {% if item.is_expired %}
            <svg class="h-3.5 w-3.5 shrink-0 text-amber-400" viewBox="0 0 20 20" fill="currentColor" aria-label="Expired memory">
                <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.515 2.625H3.72c-1.345 0-2.188-1.458-1.515-2.625L8.485 2.495zM10 6a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 6zm0 9a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"></path>
            </svg>
            {% endif %}
            <span class="text-zinc-500">{{ item.memory_type }}</span>
        </div>
        <a href="{{ item.detail_url }}" title="{{ item.summary }}" class="min-w-0 truncate text-sm text-zinc-400 hover:text-zinc-200 hover:underline">{{ item.summary }}</a>
    </li>
    {% endfor %}
</ul>
{% endif %}
