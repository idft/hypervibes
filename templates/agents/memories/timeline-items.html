{% for item in memory_timeline %}
<button type="button" data-memory-timeline-item data-memory-id="{{ item.memory_id }}" aria-pressed="{% if item.selected %}true{% else %}false{% endif %}" hx-get="{{ item.detail_url }}" hx-target="#memory-detail" hx-swap="outerHTML" hx-sync="closest [data-agent-memories]:replace" hx-indicator="[data-memory-detail-loading]" class="memory-list-item block w-full cursor-pointer rounded-xl border border-zinc-800 bg-[#0d0d10] p-3 text-left hover:border-zinc-700 hover:bg-zinc-950/80">
    <div class="text-[11px] uppercase tracking-[0.16em] text-zinc-500">
        <time class="local-datetime" data-local-format="datetime" datetime="{{ item.created_at_iso }}" title="{{ item.created_at_fallback_text }}">{{ item.created_at_fallback_text }}</time>
    </div>
    <div class="mt-2 flex flex-wrap gap-1 text-[11px]">
        <span class="inline-flex rounded-full border border-zinc-700 px-2 py-0.5 text-zinc-300">{{ item.scope }}</span>
        <span class="inline-flex rounded-full border border-zinc-700 px-2 py-0.5 text-zinc-300">{{ item.timeframe }}</span>
        <span class="inline-flex rounded-full border border-zinc-700 px-2 py-0.5 text-zinc-300">{{ item.memory_type }}</span>
    </div>
    <p class="mt-2 text-sm leading-5 text-zinc-200">{{ item.summary }}</p>
</button>
{% endfor %}
{% if let Some(url) = next_page_url %}
<div data-memory-timeline-loader hx-get="{{ url }}" hx-trigger="intersect once root:.memory-list-scroll threshold:0.5" hx-target="this" hx-swap="outerHTML" class="flex min-h-12 items-center justify-center" aria-label="Loading older memories">
    <span class="size-5 animate-spin rounded-full border-2 border-zinc-700 border-t-zinc-300" aria-hidden="true"></span>
</div>
{% endif %}
