<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in - Vibetrading</title><link rel="stylesheet" href="/static/dist/app.css"></head>
<body class="grid min-h-screen place-items-center bg-[#0a0a0b] p-6 text-zinc-100"><main class="w-full max-w-md rounded-2xl border border-zinc-800 bg-[#0d0d10] p-8"><h1 class="flex items-center justify-center gap-2 text-2xl font-semibold tracking-wide"><img src="/static/apple-touch-icon.png" alt="" class="h-7 w-7 rounded-md object-cover"><span>Vibetrading</span></h1><button id="wallet-login" class="mt-6 w-full cursor-pointer rounded-full bg-white px-4 py-2 text-sm font-medium text-black">Login</button><p id="login-error" class="mt-4 text-sm text-red-300"></p></main><script type="module">const b=document.querySelector('#wallet-login'),e=document.querySelector('#login-error');b.onclick=async()=>{try{if(!window.ethereum)throw Error('No Ethereum wallet found.');const[a]=await ethereum.request({method:'eth_requestAccounts'});const c=await fetch('/auth/challenge',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({wallet_address:a})}).then(r=>r.json());const s=await ethereum.request({method:'personal_sign',params:[c.message,a]});const r=await fetch('/auth/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({challenge_id:c.challenge_id,message:c.message,signature:s})});if(!r.ok)throw Error(await r.text());const d=await r.json().catch(()=>({redirect:'/wallet'}));location.assign(d.redirect??'/wallet')}catch(x){e.textContent=x instanceof Error?x.message:'Login failed.'}};</script></body></html>
