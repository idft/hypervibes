{% extends "base.html" %}

{% block title %}{{ memory.summary }} · {{ agent.display_name }} · Vibetrading{% endblock %}

{% block content %}
<div class="mx-auto max-w-[1400px]">
    <header class="flex flex-col gap-2 pb-6">
        <div class="flex items-center gap-3">
            <a href="/agents/{{ agent.agent_key }}" class="text-sm text-zinc-500 hover:text-zinc-300">Agents</a>
            <span class="text-zinc-600">/</span>
            <a href="/agents/{{ agent.agent_key }}" class="text-sm text-zinc-400 hover:text-zinc-200">{{ agent.display_name }}</a>
            <span class="text-zinc-600">/</span>
            <a href="/agents/{{ agent.agent_key }}/memories" class="text-sm text-zinc-400 hover:text-zinc-200">Memories</a>
        </div>
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <h1 class="text-2xl font-semibold tracking-tight text-white">{{ memory.summary }}</h1>
            <a href="/agents/{{ agent.agent_key }}" class="inline-flex w-fit items-center gap-2 rounded-full border border-zinc-800 px-4 py-2 text-sm font-medium text-zinc-300 hover:border-zinc-700 hover:text-white">
                <span aria-hidden="true">&larr;</span>
                Back to {{ agent.display_name }}
            </a>
        </div>
    </header>

    <section>
        {{ memory_detail_html|safe }}
    </section>
</div>
{% endblock %}
