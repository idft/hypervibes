[package]
name = "vibetrading"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
anyhow = "1"
askama = "0.12"
axum = "0.8"
dotenvy = "0.15"
log = "0.4"
alloy = { version = "2.0.5", default-features = false, features = ["signer-local"] }
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hypersdk = "0.2"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "rust_decimal", "migrate"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
pglite-oxide = "0.5"
http-body-util = "0.1"
