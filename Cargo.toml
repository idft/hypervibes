[workspace]
members = [".", "crates/workspace-store", "crates/workspace-controller"]
resolver = "2"

[package]
name = "hypervibes"
version = "0.3.1"
edition = "2024"
rust-version = "1.96"

[dependencies]
ammonia = "4"
anyhow = "1"
async-trait = "0.1"
askama = "0.16"
axum = "0.8"
dashmap = "6"
dotenvy = "0.15"
log = "0.4"
alloy = { version = "2.0.5", default-features = false, features = ["signer-local"] }
aes-gcm = "0.11"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hypersdk = "0.2"
pulldown-cmark = "0.13"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmp-serde = "1"
roxmltree = "0.21"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "rust_decimal", "migrate", "uuid"] }
teloxide = { version = "0.17", default-features = false, features = ["rustls", "macros"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
workspace-store = { path = "crates/workspace-store" }

[dev-dependencies]
http-body-util = "0.1"
rust_decimal_macros = "1"
