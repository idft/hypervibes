name: Publish container image

# Tag pushes only create a draft release. Publication is the explicit gate.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/idft/hypervibes

defaults:
  run:
    shell: bash

concurrency:
  group: publish-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate version tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Expected a v-prefixed release version, for example v0.4.0.' >&2
            exit 1
          fi
          if [[ "$TAG" == *-* && "$PRERELEASE" != true ]]; then
            echo 'Version suffixes must be marked as a prerelease.' >&2
            exit 1
          fi

  validate:
    needs: release-tag
    uses: ./.github/workflows/validate.yml

  publish-npm:
    name: Publish tested npm package
    needs: validate
    # Prerelease publication is not configured; never promote one to latest.
    if: ${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check npm trusted publishing support
        run: |
          node -e 'const [major, minor, patch] = require("node:child_process").execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error("npm 11.5.1 or newer is required");'
      - name: Publish tested tarball
        run: npm publish ./artifacts/hypervibes.tgz --ignore-scripts --tag latest

  publish:
    name: Publish tested ${{ matrix.arch }} image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: container-${{ matrix.arch }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push exact tested image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          gzip -dc image.tar.gz | docker load
          image="${IMAGE_NAME}:sha-${GITHUB_SHA}-${ARCH}"
          docker tag hypervibes:test "$image"
          docker push "$image" | tee push.log
          digest=$(awk '/digest: sha256:/ {print $3}' push.log)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s@%s' "$IMAGE_NAME" "$digest" > "digest-${ARCH}.txt"
      - name: Record pushed digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish multi-architecture tags
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=sha,prefix=sha-,format=long
          flavor: latest=false
      - name: Create manifests
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker buildx imagetools create --tag "$tag" \
              "$(cat digest-amd64.txt)" \
              "$(cat digest-arm64.txt)"
          done <<< "$TAGS"
