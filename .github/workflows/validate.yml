name: Validate application

on:
  pull_request:
  push:
    branches:
      - master
      - 'v*'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Checks and release build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck:server
      - name: Lint
        run: pnpm lint:server
      - name: Server tests
        timeout-minutes: 4
        run: pnpm test:server --testTimeout=240000 --hookTimeout=240000
      - name: Startup and container configuration tests
        timeout-minutes: 4
        run: node --test --test-timeout=240000 scripts/startup.test.mjs scripts/container.test.mjs
      # prepack runs the release build. Test and upload that same build, not a rebuild.
      - name: Build release tarball
        run: pnpm pack --out artifacts/hypervibes.tgz
      - name: Check release version against the tested package
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const metadata = JSON.parse(execFileSync("tar", ["-xOf", "artifacts/hypervibes.tgz", "package/package.json"], { encoding: "utf8" }));
            if (`v${metadata.version}` !== process.env.RELEASE_TAG) throw new Error("The release tag must match the package version");
          '
      - name: Compiled application tests
        timeout-minutes: 4
        run: node --test --test-timeout=240000 scripts/build.test.mjs
      - name: Upload tested release candidate
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/hypervibes.tgz
          if-no-files-found: error
          retention-days: 7

  package:
    name: Standalone package (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Checkout test script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Download release candidate
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      # No repository install or pnpm here: only the tarball's runtime dependencies.
      # Reuse npm's integrity-checked download cache between runs. The test still
      # installs node_modules fresh, but avoids a cold multi-minute download.
      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/npm-package-cache
          key: npm-package-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            npm-package-${{ runner.os }}-
      - name: Standalone package tests
        timeout-minutes: 8
        env:
          HYPERVIBES_TEST_TARBALL: ${{ github.workspace }}/artifacts/hypervibes.tgz
          HYPERVIBES_TEST_NPM_CACHE: ${{ runner.temp }}/npm-package-cache
        run: node --test --test-timeout=600000 scripts/package.test.mjs

  container:
    name: Container (${{ matrix.arch }})
    needs: [validate, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      - uses: docker/setup-buildx-action@v3
      - name: Build image from tested package
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: hypervibes:test
      - name: Check CLI
        run: docker run --rm --network none --read-only hypervibes:test --help
      - name: Smoke test without listening or network access
        timeout-minutes: 4
        run: |
          volume=$(docker volume create)
          trap 'docker volume rm "$volume"' EXIT
          for boot in 1 2; do
            docker run --rm --network none --read-only \
              --tmpfs /tmp:mode=1777 \
              --mount type=volume,src="$volume",dst=/var/lib/hypervibes \
              --mount type=bind,src="${GITHUB_WORKSPACE}/scripts/container-smoke.mjs",dst=/test.mjs,readonly \
              --entrypoint node hypervibes:test /test.mjs
          done
      # Release publication promotes these exact tested images, with no rebuild.
      - name: Export tested image
        if: github.event_name == 'release'
        run: docker save hypervibes:test | gzip > image.tar.gz
      - name: Upload tested image
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: container-${{ matrix.arch }}
          path: image.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
