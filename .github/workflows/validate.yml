name: Validate application

on:
  pull_request:
  push:
    branches:
      - master
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Checks and release build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck:server
      - name: Lint
        run: pnpm lint:server
      - name: Server tests
        timeout-minutes: 4
        run: pnpm test:server --testTimeout=240000 --hookTimeout=240000
      - name: Startup tests
        timeout-minutes: 4
        run: node --test --test-timeout=240000 scripts/startup.test.mjs
      # prepack runs the release build. Test and upload that same build, not a rebuild.
      - name: Build release tarball
        run: pnpm pack --out artifacts/hypervibes.tgz
      - name: Compiled application tests
        timeout-minutes: 4
        run: node --test --test-timeout=240000 scripts/build.test.mjs
      - name: Upload tested release candidate
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/hypervibes.tgz
          if-no-files-found: error
          retention-days: 7

  package:
    name: Standalone package (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout test script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Download release candidate
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts
      # No repository install or pnpm here: only the tarball's runtime dependencies.
      - name: Standalone package tests
        timeout-minutes: 4
        env:
          HYPERVIBES_TEST_TARBALL: ${{ github.workspace }}/artifacts/hypervibes.tgz
        run: node --test --test-timeout=240000 scripts/package.test.mjs
