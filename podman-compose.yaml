version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:18.4-alpine
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibetrading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibetrading}
      POSTGRES_DB: ${POSTGRES_DB:-vibetrading}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nautilus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  hermes-gateway:
    build:
      context: .
      dockerfile: containers/hermes-agent/Dockerfile
      args:
        HERMES_TAG: v2026.6.5
    container_name: vibetrading-hermes
    restart: unless-stopped
    network_mode: host
    volumes:
      - hermes_data:/opt/data
      - ./hermes-plugin/vibetrading:/opt/data/plugins/vibetrading:Z
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_TUI=1
      - HERMES_DASHBOARD_INSECURE=1
      - HERMES_DASHBOARD_PORT=${HERMES_DASHBOARD_PORT:-19119}
      - HERMES_DASHBOARD_SESSION_TOKEN=${HERMES_DASHBOARD_SESSION_TOKEN}
      - VIBETRADING_BASE_URL=${VIBETRADING_BASE_URL:-http://localhost:3003}
    command: ["gateway", "run"]

volumes:
  postgres_data:
    driver: local
  hermes_data:
    driver: local
