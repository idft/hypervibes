version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:18.4-alpine
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibetrading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibetrading}
      POSTGRES_DB: ${POSTGRES_DB:-vibetrading}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nautilus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  opencode:
    build:
      context: .
      dockerfile: containers/opencode/Dockerfile
      args:
        OPENCODE_TAG: 1.17.11
    image: vibetrading-opencode:local
    restart: unless-stopped
    command: ["serve", "--hostname", "0.0.0.0", "--port", "14096"]
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD must be set}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_CONFIG_DIR: /opencode-data
      XDG_DATA_HOME: /opencode-data
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      OPENCODE_DISABLE_PRUNE: "true"
      # Provider credentials are passed through to OpenCode. Uncomment the
      # ones your agents use in .env; unset values become empty strings.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # OpenCode database plugin. The plugin's SQL is unqualified, so the
      # Postgres connection must set `search_path=opencode,public`. The
      # compose hostname `postgres` resolves to the dev Postgres service
      # inside the compose network; do not switch this to localhost.
      OPENCODE_DATABASE_URL: postgres://${POSTGRES_USER:-vibetrading}:${POSTGRES_PASSWORD:-vibetrading}@postgres:5432/${POSTGRES_DB:-vibetrading}?search_path=opencode,public
      OPENCODE_DB_QUERY_TIMEOUT: ${OPENCODE_DB_QUERY_TIMEOUT:-10000}
    ports:
      - "${OPENCODE_PORT:-14096}:14096"
    volumes:
      - opencode_data:/opencode-data
      - ./workspaces:/workspaces
      - ./agent-runtime/container/opencode.jsonc:/opencode-data/opencode.jsonc:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/14096"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  opencode_data:
    driver: local
