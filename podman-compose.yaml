version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:18.4-alpine
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibetrading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibetrading}
      POSTGRES_DB: ${POSTGRES_DB:-vibetrading}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nautilus}"]
      interval: 10s
      timeout: 5s
      retries: 5

