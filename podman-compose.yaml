services:
  postgres:
    image: docker.io/library/postgres:18.4-alpine
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: hypervibes
      POSTGRES_PASSWORD: REPLACE_DB
      POSTGRES_DB: hypervibes
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypervibes -d hypervibes"]
      interval: 10s
      timeout: 5s
      retries: 5

  hypervibes:
    image: ghcr.io/idft/hypervibes:0.3.1
    restart: unless-stopped
    command: ["hypervibes"]
    environment:
      DATABASE_URL: postgres://hypervibes:REPLACE_DB@postgres:5432/hypervibes
      APP_BIND_ADDR: 0.0.0.0:3003
      APP_CACHE_DIR: /tmp/hypervibes-cache
      AGENTS_ENCRYPTION_KEY: REPLACE_KEY
      AGENTS_ENCRYPTION_KEY_ID: v1
      OPENCODE_CONTAINER_WORKSPACES_ROOT: /workspaces
      HYPERVIBES_AGENT_API_BASE_URL: http://hypervibes:3003
      WORKSPACE_CONTROL_BASE_URL: http://opencode:14097
      WORKSPACE_CONTROL_API_KEY: REPLACE_CTRL
      OPENCODE_BASE_URL: http://opencode:14096
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_SERVER_PASSWORD: REPLACE_OC
    ports:
      - "127.0.0.1:${APP_PORT:-3003}:3003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3003/healthz', timeout=5).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  opencode:
    image: ghcr.io/idft/hypervibes:0.3.1
    restart: unless-stopped
    command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "14096"]
    environment:
      OPENCODE_SERVER_PASSWORD: REPLACE_OC
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_CONFIG: /opt/hypervibes/opencode/opencode.jsonc
      OPENCODE_CONFIG_DIR: /opencode-data
      XDG_DATA_HOME: /opencode-data
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      OPENCODE_DISABLE_PRUNE: "true"
      OPENCODE_DATABASE_URL: postgres://hypervibes:REPLACE_DB@postgres:5432/hypervibes?search_path=opencode,public
      OPENCODE_DB_QUERY_TIMEOUT: "10000"
      WORKSPACE_CONTROL_API_KEY: REPLACE_CTRL
    volumes:
      - opencode_data:/opencode-data
      - agent_workspaces:/workspaces
    depends_on:
      hypervibes:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket, urllib.request; s = socket.create_connection(('127.0.0.1', 14096), 5); s.close(); urllib.request.urlopen('http://127.0.0.1:14097/health', timeout=5).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  opencode_data:
  agent_workspaces:
