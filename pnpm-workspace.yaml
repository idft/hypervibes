# Keep Browserslist data outside pnpm's minimum-release-age quarantine.
overrides:
  browserslist>baseline-browser-mapping: 2.11.28
  browserslist>node-releases: 2.0.58

allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  # Published runtime artifacts are ready to use; these scripts are only a
  # no-op (genai preinstall) and dependency-version warning (protobufjs).
  "@google/genai": false
  protobufjs: false

minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.10"
  - "@better-auth/drizzle-adapter@1.7.10"
  - "@better-auth/kysely-adapter@1.7.10"
  - "@better-auth/memory-adapter@1.7.10"
  - "@better-auth/mongo-adapter@1.7.10"
  - "@better-auth/prisma-adapter@1.7.10"
  - "@better-auth/telemetry@1.7.10"
  - better-auth@1.7.10
  - auth@1.7.10
  - "@earendil-works/chord@1.3.0"
  - "@earendil-works/pi-ai@1.3.0"
  - "@earendil-works/pi-codemode@1.3.0"
  - "@earendil-works/pi-durable@1.3.0"
  - "@earendil-works/pi-telemetry@1.3.0"
  - pinets@0.12.1
