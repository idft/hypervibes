# Keep Browserslist data outside pnpm's minimum-release-age quarantine.
overrides:
  browserslist>baseline-browser-mapping: 2.11.28
  browserslist>node-releases: 2.0.58

allowBuilds:
  esbuild: true
  "@parcel/watcher": true

minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.10"
  - "@better-auth/drizzle-adapter@1.7.10"
  - "@better-auth/kysely-adapter@1.7.10"
  - "@better-auth/memory-adapter@1.7.10"
  - "@better-auth/mongo-adapter@1.7.10"
  - "@better-auth/prisma-adapter@1.7.10"
  - "@better-auth/telemetry@1.7.10"
  - better-auth@1.7.10
  - auth@1.7.10
